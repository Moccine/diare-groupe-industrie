security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build|uploads)/
            security: false

        admin:
            lazy: true
            pattern: ^/administration(?:/|$)
            provider: app_user_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                enable_csrf: true
                default_target_path: admin
            logout:
                path: admin_logout
                target: admin_login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            entry_point: form_login

        main:
            lazy: true
            security: false

    access_control:
        - { path: ^/administration/connexion$, roles: PUBLIC_ACCESS }
        - { path: ^/administration/mot-de-passe-oublie$, roles: PUBLIC_ACCESS }
        - { path: ^/administration/mot-de-passe-oublie/envoye$, roles: PUBLIC_ACCESS }
        - { path: ^/administration/reinitialisation/, roles: PUBLIC_ACCESS }
        - { path: ^/administration(?:/|$), roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
